# Publie le dossier jeu/ sur la branche gh-pages à chaque modification, pour GitHub Pages.
name: Publier le jeu
on:
  push:
    branches: [main]
    paths: ['jeu/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copier le jeu sur la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r jeu /tmp/jeu && touch /tmp/jeu/.nojekyll
          git checkout -q --orphan gh-pages-tmp
          git rm -rqf --cached . && git clean -fdq
          cp -r /tmp/jeu/. .
          git add -A && git commit -qm "Jeu publié depuis ${GITHUB_SHA::7}"
          git push -qf origin HEAD:gh-pages
          echo "Publié sur la branche gh-pages."
